daskhub:
  dask-gateway:
    gateway:
      auth:
        jupyterhub:
          apiToken: 1327202a55ad95f335cfa99ec1c526ffbf40b3a6e5ad1397bc7dd55b5e7f37df

  jupyterhub:
    ingress:
        enabled: true
        hosts:
          - daskhub-opentofu-us-west-1.aplscicloud.org
        annotations:
          kubernetes.io/ingress.class: "nginx"
          nginx.ingress.kubernetes.io/auth-url: "https://oauth-eks-opentofu-helio-us-west-1.aplscicloud.org/oauth2/auth"
          nginx.ingress.kubernetes.io/auth-signin: "https://oauth-eks-opentofu-helio-us-west-1.aplscicloud.org/oauth2/start?rd=https://$host"
          nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-Access-Token" # headers from cognito
          nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
          nginx.ingress.kubernetes.io/proxy-buffering: "on"
    hub:
      config:
        Authenticator:
          admin_users: ['lenzinm1']
      services:
        dask-gateway:
          apiToken: 1327202a55ad95f335cfa99ec1c526ffbf40b3a6e5ad1397bc7dd55b5e7f37df
      extraEnv:
        DASKHUB_URL: "https://daskhub-opentofu-us-west-1.aplscicloud.org"
        CLIENT_ID: "16fnrgg4jjbu5rjjj7btfgk9lkc3u1qa9m5tiig7ksjd6r5bml8r"
        COGNITO_URL: "https://auth-opentofu-us-west-1.auth.us-west-1.amazoncognito.com/logout"
        OAUTH_LOGOUT_URL: "https://oauth-eks-opentofu-helio-us-west-1.aplscicloud.org/oauth2/sign_out"
