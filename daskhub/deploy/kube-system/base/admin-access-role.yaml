apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-system-admin-access-role
  namespace: kube-system
rules:
- apiGroups:
  - ""
  - "apps"
  - "*"
  resources:
  - "*"
  verbs:
  - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-system-admin-access-binding
  namespace: kube-system
subjects:
- kind: Group
  name: kube-system-admin-access-group
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: kube-system-admin-access-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-system-admin-access-clusterrole
rules:
- apiGroups:
  - "rbac.authorization.k8s.io"
  resources:
  - clusterroles
  - clusterrolebindings
  verbs:
  - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-system-admin-access-clusterrolebinding
subjects:
- kind: Group
  name: kube-system-admin-access-group
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: kube-system-admin-access-clusterrole
  apiGroup: rbac.authorization.k8s.io