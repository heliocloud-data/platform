name: CI

on:
  pull_request:
    branches:
      - develop-tf

jobs:
  formatting:
    name: Formatting And File Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

  discover-modules:
    name: Discover Modules
    runs-on: ubuntu-latest
    needs: formatting
    outputs:
      modules: ${{ steps.modules.outputs.modules }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find all modules
        id: modules
        run: |
          MODULES=$(find modules -mindepth 1 -maxdepth 1 -type d | sort | jq -R . | jq -s -c .)
          echo "modules=$MODULES" >> $GITHUB_OUTPUT

  tofu-validate-modules:
    name: Validate Terraform Modules
    runs-on: ubuntu-latest
    needs: discover-modules

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Initialize module
        run: tofu -chdir="${{ matrix.module }}" init

      - name: Validate (${{ matrix.module }})
        run: |
          if tofu -chdir="${{ matrix.module }}" validate; then
            echo "### ${{ matrix.module }} passed validation" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ${{ matrix.module }} failed validation" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  tofu-validate-root:
    name: Validate Terraform Root
    runs-on: ubuntu-latest
    needs: tofu-validate-modules

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Initialize root
        run: tofu init

      - name: Validate root
        run: |
          if tofu validate; then
            echo "### root passed validation" >> $GITHUB_STEP_SUMMARY
          else
            echo "### root failed validation" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  tofu-test:
    name: Run Terraform Tests
    runs-on: ubuntu-latest
    needs: [discover-modules, tofu-validate-root]

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.discover-modules.outputs.modules) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Initialize module
        run: tofu -chdir="${{ matrix.module }}" init

      - name: Test (${{ matrix.module }})
        run: |
          if tofu -chdir="${{ matrix.module }}" test; then
            echo "### ${{ matrix.module }} passed testing" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ${{ matrix.module }} failed testing" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
