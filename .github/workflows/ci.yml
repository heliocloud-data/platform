name: CI

on:
  pull_request:
    branches:
      - develop-tf

jobs:
  formatting:
    name: Formatting And File Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

  discover-modules:
    name: Discover Modules
    runs-on: ubuntu-latest
    needs: formatting

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find all modules
        run: |
          find modules -mindepth 1 -maxdepth 1 -type d | sort > modules.txt
          cat modules.txt

      - name: Upload modules list
        uses: actions/upload-artifact@v4
        with:
          name: modules-list
          path: modules.txt
          retention-days: 1

  tofu-validate:
    name: Validate Terraform Modules
    runs-on: ubuntu-latest
    needs: discover-modules

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Download modules list
        uses: actions/download-artifact@v4
        with:
          name: modules-list

      - name: Initialize and validate each module
        run: |
          FAILED_MODULES=""
          while IFS= read -r module; do
            echo "Initializing module: $module"
            tofu -chdir="$module" init
            echo "Validating module: $module"
            if tofu -chdir="$module" validate; then
              echo "Validation passed for $module"
            else
              echo "Validation failed for $module"
              FAILED_MODULES="$FAILED_MODULES $module"
            fi
          done < modules.txt
          
          # Fail if any module validations failed
          if [ -n "$FAILED_MODULES" ]; then
            echo "The following modules failed validation:$FAILED_MODULES"
            exit 1
          fi

  tofu-test:
    name: Run Terraform Tests
    runs-on: ubuntu-latest
    needs: discover-modules

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Download modules list
        uses: actions/download-artifact@v4
        with:
          name: modules-list

      - name: Initialize and run tests for each module
        run: |
          FAILED_MODULES=""
          while IFS= read -r module; do
            echo "Initializing module: $module"
            tofu -chdir="$module" init
            echo "Running tests for module: $module"
            if tofu -chdir="$module" test; then
              echo "Tests passed for $module"
            else
              echo "Tests failed for $module"
              FAILED_MODULES="$FAILED_MODULES $module"
            fi
          done < modules.txt
          
          # Fail if any module tests failed
          if [ -n "$FAILED_MODULES" ]; then
            echo "The following modules failed tests:$FAILED_MODULES"
            exit 1
          fi
