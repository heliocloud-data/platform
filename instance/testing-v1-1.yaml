# The following file is used for production deployments on GitLab.
#
# To run w/ this instance locally, type the following commands:
#   export CI_COMMIT_SHORT_SHA=<something>
#   envsubst < instance/gitlab-integration.yaml > instance/gitlab-integration-${CI_COMMIT_SHORT_SHA}.yaml
#
# Per-commit configurations should use: CI_COMMIT_SHORT_SHA
# Per-branch configurations should use: CI_COMMIT_REF_SLUG
#
#  See:
#   https://docs.gitlab.com/ee/ci/variables/predefined_variables.html

env:
  account: 006885615091
  region: us-west-2

# new VPC every time
vpc:
  type: new

userSharedBucket:
  destroyOnRemoval: False

email:
  use_custom_email_domain: True
  user: "no-reply"
  from_name: "APL HelioCloud"

enabled:
  registry: True
  daskhub: True
  daskhub_metrics: True
  portal: True
  registration_page: False  

auth:
  domain_prefix: "apl-helio"
  deletion_protection: True
  removal_policy: RETAIN
  
# Simple bucket names
registry:
  datasetBucketNames: [
     "heliocloud-testing-us-west-2-datasets-1",
  ]

  ingestBucketName: "heliocloud-testing-us-west-2-uploads-1"
  requesterPays: True
  catalog:
    masterUser: master
    name: "Chris Jeschke"
    contact: "chris.jeschke@jhuapl.edu"
  destroyOnRemoval: True
  layers:
    pandas: "arn:aws:lambda:us-west-2:336392948345:layer:AWSSDKPandas-Python39:6"

portal:
  domain_certificate_arn: "arn:aws:acm:us-west-2:006885615091:certificate/7bf7a036-b521-48d3-b632-4ab9ebab6663"
  domain_url: "aplscicloud.org"
  domain_record: "portal-testing-v1-1"

registration_page:
  domain_url: "aplscicloud.org"
  domain_record: "registration-testing-v1-1"

daskhub:
  eksctl:
    metadata:
      name: 'eks-helio'
      region: 'us-west-2'
    availabilityZones:
    - us-west-2a
    - us-west-2b
    iamIdentityMappings:
      - arn: arn:aws:iam::006885615091:role/CT-PowerUser-HelioCloud
        groups:
        - eks-console-dashboard-full-access-group
      - arn: arn:aws:iam::006885615091:user/CT-PowerUser-HelioCloud-nicholas.lenzi@jhuapl.edu-401
        groups:
        - eks-console-dashboard-full-access-group
        - daskhub-admin-access-group
        - monitoring-admin-access-group
        username: lenzinm1
  daskhub_storage:
    efs-persist:
      storage: 10000Gi

  daskhub:
    namespace: daskhub
    api_key1: auto
    api_key2: auto
    admin_users:
     - knowlla1
    contact_email: lisa.knowles@jhuapl.edu

    GENERIC_DOCKER_LOCATION: 'public.ecr.aws/q3h7b4o8/heliocloud/helio-daskhub-core'
    GENERIC_DOCKER_VERSION: '2025.01.29'
    MLTF_DOCKER_LOCATION: 'public.ecr.aws/q3h7b4o8/heliocloud/helio-daskhub-mltf'
    MLTF_DOCKER_VERSION: '2025.01.29'
    MLTRCH_DOCKER_LOCATION: 'public.ecr.aws/q3h7b4o8/heliocloud/helio-daskhub-mltrch'
    MLTRCH_DOCKER_VERSION: '2025.01.29'

    domain_url: "aplscicloud.org"
    domain_record: "daskhub-testing-v1-1"

  monitoring:
    AWS_LOAD_BALANCER_SSL_CERT: "arn:aws:acm:us-west-2:006885615091:certificate/7bf7a036-b521-48d3-b632-4ab9ebab6663"
    grafana_domain_prefix: grafana-testing-v1-1
    cost_analyzer_domain_prefix: kubecost-testing-v1-1
