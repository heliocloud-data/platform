# See:
#  https://kubectl.docs.kubernetes.io/references/kustomize/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base/

patches:
- target:
    kind: Deployment
    name: external-dns
  patch: |
    - op: replace
      path: /spec/template/spec/containers/0/env
      value: [{
          "name": "EXTERNAL_DNS_DOMAIN_FILTER",
          "value": "aplscicloud.org"
        }]
