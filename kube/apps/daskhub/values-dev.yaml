daskhub:
  dask-gateway:
    gateway:
      auth:
        jupyterhub:
          apiToken: bd218b774e721bda61ee7202de8859b692f90da1ae594cacaf31d253fa5c8e01

  jupyterhub:
    ingress:
        enabled: true
        ingressClassName: nginx
        hosts:
          - daskhub-opentofu-us-west-2.aplscicloud.org
        annotations:
          kubernetes.io/ingress.class: "nginx"
          nginx.ingress.kubernetes.io/auth-url: "https://oauth-eks-opentofu-helio-us-west-2.aplscicloud.org/oauth2/auth"
          nginx.ingress.kubernetes.io/auth-signin: "https://oauth-eks-opentofu-helio-us-west-2.aplscicloud.org/oauth2/start?rd=https://$host"
          nginx.ingress.kubernetes.io/auth-response-headers: "X-Auth-Request-Access-Token" # headers from cognito
          nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
          nginx.ingress.kubernetes.io/proxy-buffering: "on"
    hub:
      config:
        Authenticator:
          admin_users: ['lenzinm1']
      services:
        dask-gateway:
          apiToken: bd218b774e721bda61ee7202de8859b692f90da1ae594cacaf31d253fa5c8e01
      extraEnv:
        DASKHUB_URL: "https://daskhub-opentofu-us-west-2.aplscicloud.org"
        CLIENT_ID: "1nrdse0leel1d48m53nfgu3s1tutlh6s9c04th6d07irodide4rf"
        COGNITO_URL: "https://auth-opentofu-us-west-2.auth.us-west-2.amazoncognito.com/logout"
        OAUTH_LOGOUT_URL: "https://oauth-eks-opentofu-helio-us-west-2.aplscicloud.org/oauth2/sign_out"
