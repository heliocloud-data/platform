name: CI

on:
  pull_request:
    branches:
      - develop-tf

jobs:
  formatting:
    name: Formatting And File Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

  tofu-validate:
    name: Validate Terraform Modules
    runs-on: ubuntu-latest
    needs: formatting

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Find all module directories
        id: modules
        run: |
          MODULES=$(find modules -mindepth 1 -maxdepth 1 -type d | sort)
          echo "modules=$MODULES" >> $GITHUB_OUTPUT

      - name: Validate each module
        run: |
          for module in ${{ steps.modules.outputs.modules }}; do
            echo "Validating module: $module"
            tofu -chdir="$module" validate || exit 1
          done

  tofu-test:
    name: Run Terraform Tests
    runs-on: ubuntu-latest
    needs: tofu-validate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Find modules with test files
        id: test-modules
        run: |
          TEST_MODULES=$(find modules -mindepth 1 -maxdepth 1 -type d -exec sh -c 'ls "$1"/*.tftest.hcl 2>/dev/null && echo "$1"' _ {} | sort)
          echo "test_modules=$TEST_MODULES" >> $GITHUB_OUTPUT

      - name: Run tofu test for each module
        if: steps.test-modules.outputs.test_modules != ''
        run: |
          for module in ${{ steps.test-modules.outputs.test_modules }}; do
            echo "Running tests for module: $module"
            tofu -chdir="$module" test || exit 1
          done
